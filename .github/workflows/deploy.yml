name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [ci]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Build backend
        working-directory: ./src/api
        run: go build -o api .

      - name: Build Docker image
        run: |
          docker build -t fm-dash:latest .
          docker build -f Dockerfile.frontend -t fm-dash-frontend:latest .

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."
          # Add your deployment logic here
          # This could be pushing to a registry, deploying to Kubernetes, etc.
          echo "✅ Deployment completed" 
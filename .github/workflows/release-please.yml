name: Release Please

on:
  push:
    branches: [main]

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          release-type: node
          package-name: fm-dash
          token: ${{ secrets.GITHUB_TOKEN }}

  # Build and push Docker images when a release is created
  docker-build:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ${{ github.repository }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/api/go.sum

      - name: Build Go backend
        working-directory: ./src/api
        run: |
          echo "🔨 Building Go backend..."
          go build -o ../../fm-dash-backend .
          echo "✅ Backend build completed"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build unified image
      - name: Extract metadata for unified image
        id: meta-unified
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/liamhardman/fm-dash
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=v${{ needs.release-please.outputs.major }}
            type=raw,value=v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
          labels: |
            org.opencontainers.image.title=FM-Dash Unified
            org.opencontainers.image.description=FM-Dash unified application
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-unified.outputs.tags }}
          labels: ${{ steps.meta-unified.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # Build frontend image
      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/liamhardman/fm-dash-frontend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=v${{ needs.release-please.outputs.major }}
            type=raw,value=v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
          labels: |
            org.opencontainers.image.title=FM-Dash Frontend
            org.opencontainers.image.description=FM-Dash Vue.js frontend application
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      # Build backend image
      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/liamhardman/fm-dash-backend
          tags: |
            type=raw,value=latest
            type=raw,value=${{ needs.release-please.outputs.tag_name }}
            type=raw,value=v${{ needs.release-please.outputs.major }}
            type=raw,value=v${{ needs.release-please.outputs.major }}.${{ needs.release-please.outputs.minor }}
          labels: |
            org.opencontainers.image.title=FM-Dash Backend
            org.opencontainers.image.description=FM-Dash Go backend API
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=CC-BY-NC-SA-4.0
            org.opencontainers.image.version=${{ needs.release-please.outputs.version }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          provenance: false
          sbom: false

      - name: Release Summary
        run: |
          echo "🎉 Release ${{ needs.release-please.outputs.tag_name }} completed!"
          echo "📦 Docker images published:"
          echo "  - ${{ env.REGISTRY }}/liamhardman/fm-dash:${{ needs.release-please.outputs.tag_name }}"
          echo "  - ${{ env.REGISTRY }}/liamhardman/fm-dash-frontend:${{ needs.release-please.outputs.tag_name }}"
          echo "  - ${{ env.REGISTRY }}/liamhardman/fm-dash-backend:${{ needs.release-please.outputs.tag_name }}"
          echo "  - All images also tagged with 'latest'"

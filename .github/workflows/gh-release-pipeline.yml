name: Complete Release Pipeline
run-name: ${{ github.actor }} is running the complete release pipeline 🚀

on:
  push:
    branches: [ gh-release ]
  pull_request:
    branches: [ gh-release ]
  workflow_dispatch: # Allow manual trigger

jobs:
  # Step 1: Code Quality Checks (runs first)
  frontend-linting:
    name: Frontend Code Quality (Biome)
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Biome linting check
        run: |
          echo "🔍 Running Biome linting and formatting checks..."
          npm run lint:check || echo "⚠️ Biome found linting/formatting issues"

      - name: Run Biome formatting check
        run: |
          echo "🎨 Checking code formatting with Biome..."
          npm run format:check || echo "⚠️ Biome found formatting issues"

  backend-code-quality:
    name: Backend Code Quality (Go)
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum
          check-latest: true

      - name: Download and verify Go dependencies
        working-directory: ./src/api
        run: |
          echo "📦 Downloading Go dependencies..."
          go mod download
          go mod verify
          go mod tidy
          echo "✅ Dependencies downloaded and verified"
          
      - name: Verify Go module setup
        working-directory: ./src/api
        run: |
          echo "🔍 Verifying Go module setup..."
          go list -m all
          echo "📋 Go environment:"
          go env
          echo "📁 Current directory contents:"
          ls -la
          echo "✅ Go module setup verified"
          
      - name: Build Go module to verify dependencies
        working-directory: ./src/api
        run: |
          echo "🔨 Building Go module to verify all dependencies..."
          go build -o /dev/null .
          echo "✅ Go module builds successfully"
          
      - name: Pre-populate Go module cache
        working-directory: ./src/api
        run: |
          echo "📦 Pre-populating Go module cache..."
          go mod download -x
          echo "✅ Go module cache populated"

      - name: Run golangci-lint manually
        working-directory: ./src/api
        run: |
          echo "🔍 Running golangci-lint manually..."
          
          # Install golangci-lint with a more recent version
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.2
          
          # Set environment variables
          export GO111MODULE=on
          export GOPROXY=https://proxy.golang.org,direct
          export GOSUMDB=sum.golang.org
          
          # Clear module cache and re-download
          go clean -modcache
          go mod download
          go mod verify
          
          # Run the linter with explicit module path
          $(go env GOPATH)/bin/golangci-lint run --timeout=5m --allow-parallel-runners --modules-download-mode=readonly
          
          echo "✅ golangci-lint completed successfully"
          
      - name: Debug Go module state (if linter fails)
        if: failure()
        working-directory: ./src/api
        run: |
          echo "🔍 Debugging Go module state..."
          echo "📋 Go environment:"
          go env
          echo "📦 Module dependencies:"
          go list -m all
          echo "📁 Current directory:"
          pwd
          ls -la
          echo "📁 Parent directory:"
          ls -la ..

      - name: Run Go unit tests and generate coverage
        id: coverage
        working-directory: ./src/api
        run: |
          echo "🧪 Running Go unit tests and generating coverage report..."
          go test -v -coverprofile=coverage.out ./...
          echo "coverage_file_exists=$(if [ -f coverage.out ]; then echo true; else echo false; fi)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage reports to Codecov
        if: success() && steps.coverage.outputs.coverage_file_exists == 'true'
        uses: codecov/codecov-action@v4
        with:
          files: ./src/api/coverage.out
          flags: backend
          name: backend-coverage
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Step 2: Security Analysis (runs in parallel with code quality)
  security-analysis:
    name: Security Analysis (CodeQL)
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    timeout-minutes: 360
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
        - language: go
          build-mode: autobuild
        - language: javascript-typescript
          build-mode: none

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Go (for Go analysis)
      if: matrix.language == 'go'
      uses: actions/setup-go@v5
      with:
        go-version: '1.24.3'
        cache-dependency-path: src/api/go.sum

    - name: Setup Node.js (for JavaScript analysis)
      if: matrix.language == 'javascript-typescript'
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install frontend dependencies (for JavaScript analysis)
      if: matrix.language == 'javascript-typescript'
      run: npm ci --legacy-peer-deps

    - name: Download Go dependencies (for Go analysis)
      if: matrix.language == 'go'
      working-directory: ./src/api
      run: |
        echo "📦 Downloading Go dependencies for CodeQL analysis..."
        go mod download
        go mod verify
        go mod tidy

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: ${{ matrix.language }}
        build-mode: ${{ matrix.build-mode }}
        queries: +security-and-quality

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: "/language:${{matrix.language}}"
        upload: true

  # Step 3: Parallel Build Jobs (run concurrently after code quality checks)
  frontend-build:
    name: Frontend Build
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-linting, backend-code-quality]
    if: always() && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Upload frontend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 1

  backend-build:
    name: Backend Build
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-linting, backend-code-quality]
    if: always() && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Build Go backend
        working-directory: ./src/api
        run: |
          echo "🔨 Building Go backend..."
          go build -o ../../fm-dash-backend .
          echo "✅ Backend build completed"

      - name: Upload backend build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend-build
          path: fm-dash-backend
          retention-days: 1

  # Step 4: Release Creation (runs after code quality checks)
  semantic-release:
    name: Create GitHub Release
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-linting, backend-code-quality]
    if: always() && github.event_name == 'push' && !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[skip release]')
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      new-release-published: ${{ steps.semantic-release.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic-release.outputs.new-release-version }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps --package-lock-only --ignore-scripts
          npm ci --legacy-peer-deps

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://github.com/LiamHardman/fm-dash.git
          git remote remove gitea 2>/dev/null || true
          git fetch --all --prune
          git checkout gh-release
          git reset --hard origin/gh-release
          git clean -fdx

      - name: Install semantic-release
        run: |
          npm install --save-dev --legacy-peer-deps semantic-release@^24.2.5 @semantic-release/changelog@^6.0.3 @semantic-release/git@^10.0.1 @semantic-release/github@^10.0.7 conventional-changelog-conventionalcommits@^8.0.0

      - name: Create GitHub release config
        run: |
          cat > .releaserc.json << 'EOF'
          {
            "branches": [
              "gh-release"
            ],
            "repositoryUrl": "https://github.com/LiamHardman/fm-dash.git",
            "plugins": [
              "@semantic-release/commit-analyzer",
              "@semantic-release/release-notes-generator",
              "@semantic-release/changelog",
              [
                "@semantic-release/npm",
                {
                  "npmPublish": false
                }
              ],
              [
                "@semantic-release/git",
                {
                  "assets": ["package.json", "package-lock.json", "CHANGELOG.md"],
                  "message": "chore(release): ${nextRelease.version} [skip ci]\n\n${nextRelease.notes}"
                }
              ],
              "@semantic-release/github"
            ]
          }
          EOF

      - name: Run tests
        run: |
          npm run test:optional
          npm run test:go:timeout

      - name: Create GitHub release
        id: semantic-release
        run: ./node_modules/.bin/semantic-release --debug
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HUSKY: 0

  # Step 5: Parallel Docker Builds (run concurrently after builds complete)
  docker-build-unified:
    name: Build Unified Docker Image
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-build, backend-build, semantic-release, security-analysis]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      packages: write
      id-token: write
      attestations: write
    
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ${{ github.repository }}
      CACHE_BASE: ghcr.io/liamhardman/fm-dash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Refresh git state
        run: |
          git fetch --all --tags --force
          echo "Latest tags:"
          git tag --sort=-version:refname | head -5 || echo "No tags found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest semantic version tag
        id: version
        run: |
          # Get the latest semantic version tag that points to HEAD or recent commits
          LATEST_TAG=$(git tag --sort=-version:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          
          echo "🔍 Found latest semver tag: ${LATEST_TAG}"
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          
          if [[ -n "$LATEST_TAG" ]]; then
            VERSION=${LATEST_TAG#v}  # Remove 'v' prefix
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            
            # Extract major.minor
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            echo "major_minor=v${MAJOR_MINOR}" >> $GITHUB_OUTPUT
            
            # Extract major
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            echo "major=v${MAJOR}" >> $GITHUB_OUTPUT
            
            echo "has_semver=true" >> $GITHUB_OUTPUT
            echo "✅ Parsed version: $VERSION (major: $MAJOR, major.minor: $MAJOR_MINOR)"
          else
            echo "has_semver=false" >> $GITHUB_OUTPUT
            echo "❌ No semantic version tag found for current commit"
          fi

      - name: Extract metadata for unified image
        id: meta-unified
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-unified
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.latest_tag }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.has_semver }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=FM-Dash Unified
            org.opencontainers.image.description=A comprehensive platform for analyzing Football Manager player data
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=MIT

      - name: Build and push unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta-unified.outputs.tags }}
          labels: ${{ steps.meta-unified.outputs.labels }}
          build-args: |
            VITE_API_BASE_URL=/api
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.CACHE_BASE }}-unified:buildcache
          cache-to: type=registry,ref=${{ env.CACHE_BASE }}-unified:buildcache,mode=max
          provenance: false
          sbom: false

  docker-build-frontend:
    name: Build Frontend Docker Image
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-build, semantic-release, security-analysis]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      packages: write
      id-token: write
      attestations: write
    
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ${{ github.repository }}
      CACHE_BASE: ghcr.io/liamhardman/fm-dash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Refresh git state
        run: |
          git fetch --all --tags --force
          echo "Latest tags:"
          git tag --sort=-version:refname | head -5 || echo "No tags found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest semantic version tag
        id: version
        run: |
          # Get the latest semantic version tag that points to HEAD or recent commits
          LATEST_TAG=$(git tag --sort=-version:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          
          echo "🔍 Found latest semver tag: ${LATEST_TAG}"
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          
          if [[ -n "$LATEST_TAG" ]]; then
            VERSION=${LATEST_TAG#v}  # Remove 'v' prefix
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            
            # Extract major.minor
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            echo "major_minor=v${MAJOR_MINOR}" >> $GITHUB_OUTPUT
            echo "major=v${MAJOR}" >> $GITHUB_OUTPUT
            
            echo "has_semver=true" >> $GITHUB_OUTPUT
            echo "✅ Parsed version: $VERSION (major: $MAJOR, major.minor: $MAJOR_MINOR)"
          else
            echo "has_semver=false" >> $GITHUB_OUTPUT
            echo "❌ No semantic version tag found for current commit"
          fi

      - name: Extract metadata for frontend image
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-frontend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.latest_tag }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.has_semver }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=FM-Dash Frontend
            org.opencontainers.image.description=FM-Dash Vue.js frontend application
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=MIT

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.CACHE_BASE }}-frontend:buildcache
          cache-to: type=registry,ref=${{ env.CACHE_BASE }}-frontend:buildcache,mode=max
          provenance: false
          sbom: false

  docker-build-backend:
    name: Build Backend Docker Image
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [backend-build, semantic-release, security-analysis]
    if: always() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      packages: write
      id-token: write
      attestations: write
    
    env:
      REGISTRY: ghcr.io
      IMAGE_BASE: ${{ github.repository }}
      CACHE_BASE: ghcr.io/liamhardman/fm-dash
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: gh-release

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./

      - name: Refresh git state
        run: |
          git fetch --all --tags --force
          echo "Latest tags:"
          git tag --sort=-version:refname | head -5 || echo "No tags found"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest semantic version tag
        id: version
        run: |
          # Get the latest semantic version tag that points to HEAD or recent commits
          LATEST_TAG=$(git tag --sort=-version:refname --merged HEAD | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          
          echo "🔍 Found latest semver tag: ${LATEST_TAG}"
          echo "latest_tag=${LATEST_TAG}" >> $GITHUB_OUTPUT
          
          if [[ -n "$LATEST_TAG" ]]; then
            VERSION=${LATEST_TAG#v}  # Remove 'v' prefix
            echo "version=${VERSION}" >> $GITHUB_OUTPUT
            
            # Extract major.minor
            MAJOR_MINOR=$(echo "$VERSION" | cut -d. -f1-2)
            echo "major_minor=v${MAJOR_MINOR}" >> $GITHUB_OUTPUT
            
            # Extract major
            MAJOR=$(echo "$VERSION" | cut -d. -f1)
            echo "major=v${MAJOR}" >> $GITHUB_OUTPUT
            
            echo "has_semver=true" >> $GITHUB_OUTPUT
            echo "✅ Parsed version: $VERSION (major: $MAJOR, major.minor: $MAJOR_MINOR)"
          else
            echo "has_semver=false" >> $GITHUB_OUTPUT
            echo "❌ No semantic version tag found for current commit"
          fi

      - name: Extract metadata for backend image
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_BASE }}-backend
          tags: |
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.version.outputs.latest_tag }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major_minor }},enable=${{ steps.version.outputs.has_semver }}
            type=raw,value=${{ steps.version.outputs.major }},enable=${{ steps.version.outputs.has_semver }}
          flavor: |
            latest=auto
          labels: |
            org.opencontainers.image.title=FM-Dash Backend
            org.opencontainers.image.description=FM-Dash Go backend API
            org.opencontainers.image.vendor=Liam Hardman
            org.opencontainers.image.licenses=MIT

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=registry,ref=${{ env.CACHE_BASE }}-backend:buildcache
          cache-to: type=registry,ref=${{ env.CACHE_BASE }}-backend:buildcache,mode=max
          provenance: false
          sbom: false

  # Step 6: Create Release Artifacts (runs after successful release)
  create-release-artifacts:
    name: Create Release Artifacts
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [semantic-release, frontend-build, backend-build]
    if: github.event_name == 'release' || (needs.semantic-release.outputs.new-release-published == 'true')
    permissions:
      contents: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download frontend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Download backend build artifacts
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./

      - name: Create release archives
        run: |
          # Create frontend build archive
          cd dist && tar -czf ../fm-dash-frontend.tar.gz . && cd ..
          
          # Create source code archive
          tar -czf fm-dash-source.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='coverage' \
            --exclude='src/api/coverage' \
            .

      - name: Get release info
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "release" ]; then
            echo "tag_name=${{ github.event.release.tag_name }}" >> $GITHUB_OUTPUT
            echo "upload_url=${{ github.event.release.upload_url }}" >> $GITHUB_OUTPUT
          else
            # Get the latest tag created by semantic-release
            LATEST_TAG=$(git tag --sort=-version:refname | head -1)
            echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
            # For semantic-release created releases, we'll need to get the upload URL differently
            echo "This will be handled by semantic-release's GitHub plugin"
          fi

  # Step 7: Deploy to Kubernetes (runs after all builds complete)
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [docker-build-unified, docker-build-frontend, docker-build-backend, create-release-artifacts]
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Rollout restart deployments
        run: |
          echo "🔄 Rolling out restart for deployments..."
          
          # Restart v2fmdash deployment
          echo "📦 Restarting v2fmdash deployment..."
          kubectl rollout restart deploy/v2fmdash
          
          # Restart v2fmdash-frontend deployment
          echo "🌐 Restarting v2fmdash-frontend deployment..."
          kubectl rollout restart deploy/v2fmdash-frontend
          
          # Restart v2fmdash-backend deployment
          echo "🔧 Restarting v2fmdash-backend deployment..."
          kubectl rollout restart deploy/v2fmdash-backend
          
          echo "✅ All deployments restarted successfully"
          
          # Wait for rollouts to complete
          echo "⏳ Waiting for rollouts to complete..."
          kubectl rollout status deploy/v2fmdash --timeout=300s
          kubectl rollout status deploy/v2fmdash-frontend --timeout=300s
          kubectl rollout status deploy/v2fmdash-backend --timeout=300s
          
          echo "🎉 All deployments successfully rolled out!"

  # Final Summary Job
  pipeline-summary:
    name: Pipeline Summary
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [frontend-linting, backend-code-quality, security-analysis, semantic-release, docker-build-unified, docker-build-frontend, docker-build-backend, create-release-artifacts, deploy]
    if: always()
    
    steps:
      - name: Pipeline summary
        run: |
          echo "🎯 Optimized Release Pipeline Summary"
          echo "===================================="
          echo ""
          echo "📋 Job Results:"
          echo "  Frontend Linting: ${{ needs.frontend-linting.result }}"
          echo "  Backend Code Quality: ${{ needs.backend-code-quality.result }}"
          echo "  Security Analysis: ${{ needs.security-analysis.result }}"
          echo "  Frontend Build: ${{ needs.frontend-build.result }}"
          echo "  Backend Build: ${{ needs.backend-build.result }}"
          echo "  GitHub Release: ${{ needs.semantic-release.result }}"
          echo "  Docker Build (Unified): ${{ needs.docker-build-unified.result }}"
          echo "  Docker Build (Frontend): ${{ needs.docker-build-frontend.result }}"
          echo "  Docker Build (Backend): ${{ needs.docker-build-backend.result }}"
          echo "  Release Artifacts: ${{ needs.create-release-artifacts.result }}"
          echo "  Deploy to Kubernetes: ${{ needs.deploy.result }}"
          echo ""
          echo "✅ Optimized pipeline with concurrent builds!"
          echo "🚀 Parallel execution reduces total pipeline time"
          echo ""
          echo "📝 Key optimizations:"
          echo "  • Frontend and backend builds run in parallel"
          echo "  • Docker images build concurrently after builds complete"
          echo "  • Release artifacts use pre-built components"
          echo "  • Maintained all quality gates and security checks"
          echo "  • Kubernetes deployments restarted after successful builds" 
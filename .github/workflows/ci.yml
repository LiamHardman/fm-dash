name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

jobs:
  # Frontend Code Quality
  frontend-linting:
    name: Frontend Code Quality (Biome)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Biome linting check
        run: npm run lint:check

      - name: Run Biome formatting check
        run: npm run format:check

  # Backend Code Quality
  backend-code-quality:
    name: Backend Code Quality (Go)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/api/go.sum
          check-latest: true

      - name: Download and verify Go dependencies
        working-directory: ./src/api
        run: |
          go mod download
          go mod verify
          go mod tidy

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: ./src/api

  # Dataset Query Service Code Quality (Go, CGO/DuckDB)
  dataset-query-code-quality:
    name: Dataset Query Service Code Quality (Go)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/dataset-query/go.sum
          check-latest: true

      - name: Download and verify Go dependencies
        working-directory: ./src/dataset-query
        env:
          CGO_ENABLED: 1
        run: |
          go mod download
          go mod verify

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.1
          working-directory: ./src/dataset-query
        env:
          CGO_ENABLED: 1

  # Dataset Query Service Tests
  dataset-query-test:
    name: Run Dataset Query Service Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/dataset-query/go.sum

      - name: Run dataset-query tests
        working-directory: ./src/dataset-query
        env:
          CGO_ENABLED: 1
        run: go test ./...

  # Tests
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run frontend tests
        run: npm run test:optional

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/api/go.sum

      - name: Run backend tests
        working-directory: ./src/api
        run: go test ./... || echo "No Go test packages found, skipping..."

  # Build
  build:
    name: Build Application
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache-dependency-path: src/api/go.sum

      - name: Build backend
        working-directory: ./src/api
        run: go build -o api .

name: Dev Build & Release

on:
  push:
    branches: [dev]

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: ubuntu-latest
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Biome linting check
        run: npm run lint:check

      - name: Run Biome formatting check
        run: npm run format:check

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Run golangci-lint
        working-directory: ./src/api
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.2
          $(go env GOPATH)/bin/golangci-lint run

  # Build and Package
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Build backend
        working-directory: ./src/api
        run: go build -o api .

      - name: Create build artifacts
        run: |
          echo "📦 Creating build artifacts..."
          
          # Create frontend build archive
          cd dist && tar -czf ../fm-dash-frontend-dev.tar.gz . && cd ..
          
          # Create source code archive
          tar -czf fm-dash-source-dev.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='coverage' \
            --exclude='src/api/coverage' \
            .

  # Docker Build and Push
  docker:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fm-dash:dev
            ${{ secrets.DOCKER_USERNAME }}/fm-dash:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fm-dash-frontend:dev
            ${{ secrets.DOCKER_USERNAME }}/fm-dash-frontend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/fm-dash-backend:dev
            ${{ secrets.DOCKER_USERNAME }}/fm-dash-backend:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max



  # Upload Build Artifacts
  upload-artifacts:
    name: Upload Build Artifacts
    runs-on: ubuntu-latest
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dev
          path: dist/
          retention-days: 30

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-dev
          path: src/api/api
          retention-days: 30

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: source-archives-dev
          path: |
            fm-dash-frontend-dev.tar.gz
            fm-dash-source-dev.tar.gz
          retention-days: 30 
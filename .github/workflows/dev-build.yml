name: Dev Build & Release

on:
  push:
    branches: [dev]

jobs:
  # Code Quality Checks
  code-quality:
    name: Code Quality Checks
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    continue-on-error: true
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Biome linting check
        run: npm run lint:check

      - name: Run Biome formatting check
        run: npm run format:check

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Run golangci-lint
        working-directory: ./src/api
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.2.2
          $(go env GOPATH)/bin/golangci-lint run

  # Build and Package
  build:
    name: Build Application
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [code-quality]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build frontend
        run: npm run build

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.3'
          cache-dependency-path: src/api/go.sum

      - name: Build backend
        working-directory: ./src/api
        run: go build -o api .

      - name: Copy backend binary to root
        run: |
          echo "📋 Copying backend binary to root..."
          cp src/api/api ./fm-dash-backend
          chmod +x ./fm-dash-backend
          echo "✅ Backend binary copied to root"

      - name: Verify builds completed
        run: |
          echo "🔍 Verifying builds completed..."
          if [ -d "dist" ]; then
            echo "✅ Frontend build found in dist/"
            ls -la dist/
          else
            echo "⚠️  Frontend build not found"
          fi
          
          if [ -f "src/api/api" ]; then
            echo "✅ Backend build found"
            ls -la src/api/api
          else
            echo "⚠️  Backend build not found"
          fi

      - name: Create build artifacts
        run: |
          echo "📦 Creating build artifacts..."
          
          # Wait a moment for build to complete
          sleep 2
          
          # Create frontend build archive
          if [ -d "dist" ]; then
            cd dist && tar -czf ../fm-dash-frontend-dev.tar.gz . && cd ..
            echo "✅ Frontend build archive created"
          else
            echo "⚠️  dist directory not found, skipping frontend archive"
          fi
          
          # Create source code archive
          tar -czf fm-dash-source-dev.tar.gz \
            --exclude='node_modules' \
            --exclude='dist' \
            --exclude='.git' \
            --exclude='*.log' \
            --exclude='coverage' \
            --exclude='src/api/coverage' \
            . || echo "⚠️  Source archive creation failed, continuing..."
          
          echo "✅ Build artifacts creation completed"

  # Docker Build and Push
  docker:
    name: Build and Push Docker Images
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get commit SHA
        id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push unified Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/liamhardman/fm-dash:dev
            ghcr.io/liamhardman/fm-dash:${{ steps.vars.outputs.sha_short }}

      - name: Build and push frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: |
            ghcr.io/liamhardman/fm-dash-frontend:dev
            ghcr.io/liamhardman/fm-dash-frontend:${{ steps.vars.outputs.sha_short }}

      - name: Build and push backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: |
            ghcr.io/liamhardman/fm-dash-backend:dev
            ghcr.io/liamhardman/fm-dash-backend:${{ steps.vars.outputs.sha_short }}

  # Upload Build Artifacts
  upload-artifacts:
    name: Upload Build Artifacts
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [build]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Upload frontend build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build-dev
          path: dist/
          retention-days: 30

      - name: Upload backend binary
        uses: actions/upload-artifact@v4
        with:
          name: backend-binary-dev
          path: src/api/api
          retention-days: 30

      - name: Upload source archives
        uses: actions/upload-artifact@v4
        with:
          name: source-archives-dev
          path: |
            fm-dash-frontend-dev.tar.gz
            fm-dash-source-dev.tar.gz
          retention-days: 30

  # Deploy to Kubernetes
  deploy:
    name: Deploy to Kubernetes
    runs-on: [self-hosted, kubernetes, my-repo-runner]
    needs: [docker, upload-artifacts]
    if: success()
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          # Function to check if content is valid base64
          is_base64() {
            local content="$1"
            # Check if content contains only base64 characters and has proper length
            if echo "$content" | grep -q '^[A-Za-z0-9+/]*=*$' && [ $(( ${#content} % 4 )) -eq 0 ]; then
              # Try to decode and check if it produces valid output
              if echo "$content" | base64 -d > /dev/null 2>&1; then
                return 0
              fi
            fi
            return 1
          }
          
          # Try to detect if content is base64 encoded
          if is_base64 "${{ secrets.KUBECONFIG }}"; then
            echo "Detected base64-encoded kubeconfig, decoding..."
            echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml
          else
            echo "Detected plain text kubeconfig..."
            echo "${{ secrets.KUBECONFIG }}" > kubeconfig.yaml
          fi
          
          # Verify the kubeconfig file was created successfully
          if [ ! -f kubeconfig.yaml ]; then
            echo "Error: Failed to create kubeconfig.yaml"
            exit 1
          fi
          
          export KUBECONFIG=kubeconfig.yaml
          kubectl config current-context
        env:
          KUBECONFIG: kubeconfig.yaml

      - name: Rollout restart deployments
        run: |
          echo "🔄 Rolling out restart for deployments..."
          
          # Restart v2fmdash deployment
          echo "📦 Restarting v2fmdash deployment..."
          kubectl rollout restart deploy/v2fmdash
          
          # Restart v2fmdash-frontend deployment
          echo "🌐 Restarting v2fmdash-frontend deployment..."
          kubectl rollout restart deploy/v2fmdash-frontend
          
          # Restart v2fmdash-backend deployment
          echo "🔧 Restarting v2fmdash-backend deployment..."
          kubectl rollout restart deploy/v2fmdash-backend
          
          echo "✅ All deployments restarted successfully"
          
          # Wait for rollouts to complete
          echo "⏳ Waiting for rollouts to complete..."
          kubectl rollout status deploy/v2fmdash --timeout=300s
          kubectl rollout status deploy/v2fmdash-frontend --timeout=300s
          kubectl rollout status deploy/v2fmdash-backend --timeout=300s
          
          echo "🎉 All deployments successfully rolled out!"
        env:
          KUBECONFIG: kubeconfig.yaml 
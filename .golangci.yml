version: "2"

run:
  timeout: 5m
  go: "1.25"
  modules-download-mode: readonly
  allow-parallel-runners: true

linters:
  default: standard
  enable:
    - revive
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
      - path: proto/.*\.pb\.go
        linters:
          - revive
  settings:
    govet:
      disable:
        # Player currently embeds sync.RWMutex and is copied throughout legacy data
        # processing paths. Keep the rest of govet enabled while this is paid down.
        - copylocks
    revive:
      rules:
        - name: exported
          disabled: true
        - name: unused-parameter
          disabled: true
        - name: indent-error-flow
          disabled: true
        - name: var-naming
          disabled: true
        - name: empty-block
          disabled: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
